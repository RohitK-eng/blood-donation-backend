services:

  backend1:
    build: .
    container_name: backend1
    env_file:
      - .env
    environment:
      INSTANCE_ID: backend1
    ports:
      - "5001:5000"

  backend2:
    build: .
    container_name: backend2
    env_file:
      - .env
    environment:
      INSTANCE_ID: backend2
    ports:
      - "5002:5000"

  backend3:
    build: .
    container_name: backend3
    env_file:
      - .env
    environment:
      INSTANCE_ID: backend3
    ports:
      - "5003:5000"

  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3